<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 - Monitor de Temperatura</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --green: #00c853;
    --blue: #448aff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  .sensor-row {
    display: flex;
    justify-content: space-around;
    gap: 12px;
    margin-bottom: 12px;
  }
  .sensor-box {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    border-radius: 12px;
    background: var(--accent);
  }
  .sensor-box .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .sensor-box .value {
    font-size: 2rem;
    font-weight: 700;
  }
  .sensor-box .unit {
    font-size: 1rem;
    opacity: 0.7;
  }
  .sonoff-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sonoff-label {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    transition: background .3s;
  }
  .dot.on  { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.off { background: #555; }

  /* Toggle switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 56px;
    height: 30px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #555;
    border-radius: 30px;
    transition: .3s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 24px;
    width: 24px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: .3s;
  }
  input:checked + .slider { background: var(--green); }
  input:checked + .slider::before { transform: translateX(26px); }

  .footer {
    text-align: center;
    font-size: 0.7rem;
    opacity: 0.4;
    margin-top: 4px;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    opacity: 0.5;
    padding: 0 4px;
  }
  .loading {
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ Monitor ESP32</h1>

  <!-- Temperatura e Umidade -->
  <div class="card">
    <div class="sensor-row">
      <div class="sensor-box">
        <div class="label">Temperatura</div>
        <div class="value" id="temperatura">--</div>
        <div class="unit">°C</div>
      </div>
      <div class="sensor-box">
        <div class="label">Umidade</div>
        <div class="value" id="umidade">--</div>
        <div class="unit">%</div>
      </div>
    </div>
  </div>

  <!-- Controle Sonoff -->
  <div class="card sonoff-card">
    <div class="sonoff-label">
      <span class="dot off" id="dot"></span>
      <span id="sonoffText">Tomada Desligada</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="sonoffToggle" onchange="toggleSonoff()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar">
    <span id="wsStatus" class="loading">Conectando...</span>
    <span id="updateTime">--</span>
  </div>

  <div class="footer">ESP32 + DHT22 + Sonoff &bull; Home Assistant</div>
</div>

<script>
const wsUrl = 'ws://' + location.host + '/ws';
let socket = null;
let reconnectTimer = null;

function connectWebSocket() {
  if (socket) socket.close();
  socket = new WebSocket(wsUrl);

  socket.onopen = () => {
    document.getElementById('wsStatus').textContent = '🟢 Conectado';
    document.getElementById('wsStatus').classList.remove('loading');
  };

  socket.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.temperatura !== undefined) {
        document.getElementById('temperatura').textContent = data.temperatura.toFixed(1);
      }
      if (data.umidade !== undefined) {
        document.getElementById('umidade').textContent = data.umidade.toFixed(1);
      }
      if (data.sonoff !== undefined) {
        const ligado = data.sonoff === 'ligado';
        document.getElementById('sonoffToggle').checked = ligado;
        updateSonoffUI(ligado);
      }
      document.getElementById('updateTime').textContent =
        new Date().toLocaleTimeString('pt-BR');
    } catch (err) {
      console.error('Erro JSON:', err);
    }
  };

  socket.onclose = () => {
    document.getElementById('wsStatus').textContent = '🔴 Desconectado';
    document.getElementById('wsStatus').classList.add('loading');
    reconnectTimer = setTimeout(connectWebSocket, 3000);
  };

  socket.onerror = () => socket.close();
}

function updateSonoffUI(ligado) {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('sonoffText');
  if (ligado) {
    dot.className = 'dot on';
    txt.textContent = 'Tomada Ligada';
  } else {
    dot.className = 'dot off';
    txt.textContent = 'Tomada Desligada';
  }
}

function toggleSonoff() {
  const ligado = document.getElementById('sonoffToggle').checked;
  const estado = ligado ? '1' : '0';

  fetch('/api/sonoff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'estado=' + estado
  })
  .then(r => r.json())
  .then(data => {
    updateSonoffUI(ligado);
    console.log('Sonoff:', data);
  })
  .catch(err => {
    console.error('Erro:', err);
    document.getElementById('sonoffToggle').checked = !ligado;
  });
}

// Inicia
connectWebSocket();

// Fallback: polling HTTP a cada 10s caso WebSocket falhe
setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    fetch('/api/status')
      .then(r => r.json())
      .then(data => {
        if (data.temperatura !== undefined) {
          document.getElementById('temperatura').textContent = data.temperatura.toFixed(1);
          document.getElementById('umidade').textContent = data.umidade.toFixed(1);
          document.getElementById('updateTime').textContent =
            new Date().toLocaleTimeString('pt-BR');
        }
      })
      .catch(() => {});
  }
}, 10000);
</script>
</body>
</html>
