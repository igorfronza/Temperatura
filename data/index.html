<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 - Monitor de Temperatura</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --green: #00c853;
    --blue: #448aff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  .sensor-row {
    display: flex;
    justify-content: space-around;
    gap: 12px;
  }
  .sensor-box {
    flex: 1;
    text-align: center;
    padding: 14px 8px;
    border-radius: 12px;
    background: var(--accent);
  }
  .sensor-box .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .sensor-box .value {
    font-size: 1.8rem;
    font-weight: 700;
  }
  .sensor-box .unit {
    font-size: 0.85rem;
    opacity: 0.7;
  }

  /* Cards dos Sonoffs */
  .sonoff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .sonoff-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
    transition: border 0.3s;
    border: 2px solid transparent;
  }
  .sonoff-item.on {
    border-color: var(--green);
  }
  .sonoff-name {
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    background: #555;
    transition: background .3s, box-shadow .3s;
  }
  .dot.on {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  /* Toggle switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 26px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #555;
    border-radius: 26px;
    transition: .3s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: .3s;
  }
  input:checked + .slider { background: var(--green); }
  input:checked + .slider::before { transform: translateX(24px); }

  .footer {
    text-align: center;
    font-size: 0.65rem;
    opacity: 0.4;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    opacity: 0.5;
    padding: 0 4px;
  }
  .loading { animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ Monitor ESP32</h1>

  <!-- Temperatura e Umidade -->
  <div class="card">
    <div class="sensor-row">
      <div class="sensor-box">
        <div class="label">Temperatura</div>
        <div class="value" id="temperatura">--</div>
        <div class="unit">°C</div>
      </div>
      <div class="sensor-box">
        <div class="label">Umidade</div>
        <div class="value" id="umidade">--</div>
        <div class="unit">%</div>
      </div>
    </div>
  </div>

  <!-- 4 Sonoffs -->
  <div class="sonoff-grid" id="sonoffGrid"></div>

  <div class="status-bar">
    <span id="wsStatus" class="loading">Conectando...</span>
    <span id="updateTime">--</span>
  </div>

  <div class="footer">ESP32 + DHT22 + 5 Sonoffs &bull; Home Assistant</div>
</div>

<script>
const wsUrl = 'ws://' + location.host + '/ws';
let socket = null;
let reconnectTimer = null;

// Template HTML para cada Sonoff
function criarSonoffHTML(id, nome) {
  return `
    <div class="sonoff-item" id="sonoff-${id}">
      <div class="sonoff-name">
        <span class="dot" id="dot-${id}"></span>
        ${nome}
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-${id}" onchange="toggleSonoff(${id})">
        <span class="slider"></span>
      </label>
    </div>`;
}

// Cria os 5 cards de Sonoff (nomes atualizados pelo WebSocket)
const grid = document.getElementById('sonoffGrid');
for (let i = 1; i <= 5; i++) {
  grid.innerHTML += criarSonoffHTML(i, 'Tomada ' + i);
}

function connectWebSocket() {
  if (socket) socket.close();
  socket = new WebSocket(wsUrl);

  socket.onopen = () => {
    document.getElementById('wsStatus').textContent = '🟢 Conectado';
    document.getElementById('wsStatus').classList.remove('loading');
  };

  socket.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.temperatura !== undefined) {
        document.getElementById('temperatura').textContent = data.temperatura.toFixed(1);
      }
      if (data.umidade !== undefined) {
        document.getElementById('umidade').textContent = data.umidade.toFixed(1);
      }
      // Atualiza estado dos Sonoffs
      if (data.sonoffs && Array.isArray(data.sonoffs)) {
        data.sonoffs.forEach(s => {
          updateSonoffUI(s.id, s.nome, s.ligado);
        });
      }
      document.getElementById('updateTime').textContent =
        new Date().toLocaleTimeString('pt-BR');
    } catch (err) {
      console.error('Erro JSON:', err);
    }
  };

  socket.onclose = () => {
    document.getElementById('wsStatus').textContent = '🔴 Desconectado';
    document.getElementById('wsStatus').classList.add('loading');
    reconnectTimer = setTimeout(connectWebSocket, 3000);
  };

  socket.onerror = () => socket.close();
}

function updateSonoffUI(id, nome, ligado) {
  const item = document.getElementById('sonoff-' + id);
  const dot = document.getElementById('dot-' + id);
  const toggle = document.getElementById('toggle-' + id);

  if (!item || !toggle) return;

  // Atualiza nome se veio do WebSocket
  if (nome) {
    const nameDiv = item.querySelector('.sonoff-name');
    nameDiv.innerHTML = '<span class="dot' + (ligado ? ' on' : '') + '" id="dot-' + id + '"></span> ' + nome;
  }

  toggle.checked = ligado;

  if (ligado) {
    item.classList.add('on');
    // re-seleciona dot após recriação
    const d = document.getElementById('dot-' + id);
    if (d) d.classList.add('on');
  } else {
    item.classList.remove('on');
  }
}

function toggleSonoff(id) {
  const toggle = document.getElementById('toggle-' + id);
  const ligado = toggle.checked;
  const estado = ligado ? '1' : '0';

  fetch('/api/sonoff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'id=' + id + '&estado=' + estado
  })
  .then(r => r.json())
  .then(data => {
    console.log('Sonoff ' + id + ':', data);
    updateSonoffUI(id, null, ligado);
  })
  .catch(err => {
    console.error('Erro:', err);
    toggle.checked = !ligado;  // reverte
  });
}

// Inicia
connectWebSocket();

// Fallback: polling HTTP a cada 15s
setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    fetch('/api/status')
      .then(r => r.json())
      .then(data => {
        if (data.temperatura !== undefined) {
          document.getElementById('temperatura').textContent = data.temperatura.toFixed(1);
          document.getElementById('umidade').textContent = data.umidade.toFixed(1);
        }
        if (data.sonoffs && Array.isArray(data.sonoffs)) {
          data.sonoffs.forEach(s => updateSonoffUI(s.id, s.nome, s.ligado));
        }
        document.getElementById('updateTime').textContent =
          new Date().toLocaleTimeString('pt-BR');
      })
      .catch(() => {});
  }
}, 15000);
</script>
</body>
</html>
